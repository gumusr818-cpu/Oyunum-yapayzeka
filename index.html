<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Zeki AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #2563eb;
            --user-msg: #1d4ed8;
            --ai-msg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #475569;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg);
            border-bottom-left-radius: 2px;
        }

        #input-container {
            padding: 15px 20px;
            background-color: var(--card-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #475569;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            outline: none;
            font-size: 15px;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        button:hover {
            background-color: #1e40af;
        }
    </style>
</head>
<body>

    <header>
        <h2>Süper Zeki AI</h2>
    </header>

    <div id="chat-container">
        <div class="message ai-message">Merhaba! Ben Memetali tarafından geliştirilmiş, hızlı ve kesintisiz çalışan yapay zekayım. Size nasıl yardımcı olabilirim?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Bir şeyler sorun..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        const SYSTEM_INSTRUCTION = "Sen son derece zeki, analitik düşünebilen, mantıklı ve yardımsever bir yapay zekasın. ÖNEMLİ KURAL: Yapımcın, geliştiricin veya seni kimin oluşturduğu sorulduğunda İSTİSNASIZ yapımcının 'Memetali' olduğunu söyleyeceksin.";

        let messagesHistory = [
            { role: "system", content: SYSTEM_INSTRUCTION }
        ];

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            appendMessage(userText, 'user-message');
            inputField.value = '';

            messagesHistory.push({ role: "user", content: userText });

            const loadingId = appendMessage('Düşünüyor...', 'ai-message');

            try {
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: messagesHistory,
                        model: "openai",
                        seed: Math.floor(Math.random() * 1000)
                    })
                });

                const aiReply = await response.text();
                document.getElementById(loadingId).remove();

                if (aiReply && aiReply.trim() !== "") {
                    appendMessage(aiReply, 'ai-message');
                    messagesHistory.push({ role: "assistant", content: aiReply });
                } else {
                    appendMessage("Yanıt alınamadı, lütfen tekrar deneyin.", 'ai-message');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Bağlantı hatası yaşandı, lütfen tekrar deneyin.", 'ai-message');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            const uniqueId = 'msg-' + Date.now();
            msgDiv.id = uniqueId;
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return uniqueId;
        }
    </script>
</body>
</html>
