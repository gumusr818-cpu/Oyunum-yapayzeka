<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Zeki AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --user-msg: #2563eb;
            --ai-msg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #475569;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg);
            border-bottom-left-radius: 2px;
        }

        #input-container {
            padding: 20px;
            background-color: var(--card-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #475569;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <header>
        <h2>Süper Zeki AI (Anahtarsız)</h2>
    </header>

    <div id="chat-container">
        <div class="message ai-message">Merhaba! Ben Memetali tarafından geliştirilmiş, doğrudan kullanıma hazır yapay zekayım. Size nasıl yardımcı olabilirim?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Bir şeyler sorun..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        const SYSTEM_PROMPT = "<|system|>\nSen son derece zeki, analitik düşünebilen ve mantıklı bir yapay zekasın. Yapımcın, geliştiricin veya seni kimin oluşturduğu sorulduğunda İSTİSNASIZ yapımcının 'Memetali' olduğunu söyleyeceksin.</s>\n";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            appendMessage(userText, 'user-message');
            inputField.value = '';

            const loadingId = appendMessage('Düşünüyor...', 'ai-message');

            const fullPrompt = `${SYSTEM_PROMPT}<|user|>\n${userText}</s>\n<|assistant|>\n`;

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/meta-llama/Meta-Llama-3-8B-Instruct", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: fullPrompt,
                        parameters: {
                            max_new_tokens: 512,
                            temperature: 0.7
                        }
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (Array.isArray(data) && data[0].generated_text) {
                    let aiReply = data[0].generated_text.replace(fullPrompt, '').trim();
                    appendMessage(aiReply, 'ai-message');
                } else if (data.error && data.error.includes("loading")) {
                    appendMessage("Model şu anda sunucuda yükleniyor, lütfen 10 saniye sonra tekrar deneyin.", 'ai-message');
                } else {
                    appendMessage("Şu an yanıt alınamadı, lütfen tekrar deneyin.", 'ai-message');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Bağlantı hatası oluştu.", 'ai-message');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            const uniqueId = 'msg-' + Date.now();
            msgDiv.id = uniqueId;
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return uniqueId;
        }
    </script>
</body>
</html>
